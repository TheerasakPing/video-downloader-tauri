[package]
name = "tauri-app"
version = "1.10.0"
description = "Rongyok Video Downloader"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTML parsing
scraper = "0.22"
regex = "1"

# File operations
futures-util = "0.3"
dirs = "5"

# Base64 encoding
base64 = "0.22"

# Error handling
thiserror = "2"
anyhow = "1"

# AES-128-CBC for HLS stream decryption
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"

# Headless browser for auto-detection
headless_chrome = "1.0"

# SQLite for content library
rusqlite = { version = "0.31", features = ["bundled"] }
# Date/time handling
chrono = "0.4"
urlencoding = "2.1.3"
