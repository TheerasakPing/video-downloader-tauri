                    displayTitle = title.slice(0, -2).trim() + 'พากย์ไทย';
                } else if (title.toLowerCase().endsWith('sub')) {
                    displayTitle = title.slice(0, -3).trim() + 'ซับไทย';
                }
                document.title = `รับชม ${displayTitle} - Rongyok`;
                
                // ตรวจสอบว่ามีตอนหรือไม่
                if (seriesData.episodes && seriesData.episodes.length > 0) {
                    // จัดการข้อมูลตอนด้วยฟังก์ชันจาก watch.js
                    handleEpisodesLoaded(seriesData);
                    
                    // เพิ่ม event listener สำหรับปุ่มปิดโมดัลรายการตอน
                    document.getElementById('closeEpisodeModal').addEventListener('click', () => {
                        document.getElementById('episodeModal').classList.remove('active');
                    });
                    
                    // ยอดวิวได้ถูกอัปเดตแล้วใน PHP เมื่อโหลดหน้า
                } else {
                    // แสดงข้อความว่าไม่พบตอน
                    document.getElementById('loadingMessage').style.display = 'none';
                    document.getElementById('errorText').textContent = 'ไม่พบตอนของซีรี่ส์นี้';
                    document.getElementById('errorMessage').style.display = 'flex';
                }
            } else {
                // แสดงข้อความว่าไม่พบซีรี่ส์
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('errorText').textContent = 'ไม่พบข้อมูลซีรี่ส์';
                document.getElementById('errorMessage').style.display = 'flex';
            }
        }
        
        // ยอดวิวได้ถูกอัปเดตแล้วใน PHP เมื่อโหลดหน้า
    </script>
